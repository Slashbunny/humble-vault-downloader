---
name: PSR-12 Code Style Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: phpcs

      - name: Run phpcs with PSR-12 ruleset
        run: phpcs --standard=PSR12 -n src/
